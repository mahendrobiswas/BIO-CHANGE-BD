<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Free Fire Bio Changer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', 'Exo 2', sans-serif;
        }

        :root {
            --primary: #ff4444;
            --primary-dark: #cc0000;
            --secondary: #1a1a2e;
            --accent: #ffaa00;
            --background: #0f0f23;
            --card-bg: rgba(26, 26, 46, 0.95);
            --text: #ffffff;
            --text-muted: #b0b0b0;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff4444;
            --glass: rgba(255, 255, 255, 0.15);
            --neon-glow: 0 0 10px rgba(255, 68, 68, 0.7), 0 0 20px rgba(255, 68, 68, 0.5), 0 0 30px rgba(255, 68, 68, 0.3);
            --header-bg: rgba(10, 10, 10, 0.98);
        }

        [data-theme="light"] {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #ffffff;
            --accent: #17a2b8;
            --background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.98);
            --text: #2d3748;
            --text-muted: #4a5568;
            --success: #28a745;
            --warning: #ffc107;
            --error: #dc3545;
            --glass: rgba(0, 0, 0, 0.1);
            --neon-glow: 0 0 20px rgba(0, 123, 255, 0.4);
            --header-bg: rgba(255, 255, 255, 0.98);
        }

        [data-theme="red"] {
            --primary: #dc3545;
            --primary-dark: #c82333;
            --secondary: #2d0000;
            --accent: #ff6b6b;
            --background: #1a0000;
            --card-bg: rgba(45, 0, 0, 0.95);
            --text: #ffffff;
            --text-muted: #ff9999;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff4444;
            --glass: rgba(255, 0, 0, 0.15);
            --neon-glow: 0 0 10px rgba(220, 53, 69, 0.7), 0 0 20px rgba(220, 53, 69, 0.5);
            --header-bg: rgba(26, 0, 0, 0.98);
        }

        [data-theme="blue"] {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #001f3f;
            --accent: #7fdbff;
            --background: #001529;
            --card-bg: rgba(0, 31, 63, 0.95);
            --text: #ffffff;
            --text-muted: #7fdbff;
            --success: #2ecc40;
            --warning: #ffdc00;
            --error: #ff4136;
            --glass: rgba(0, 123, 255, 0.15);
            --neon-glow: 0 0 10px rgba(0, 123, 255, 0.7), 0 0 20px rgba(0, 123, 255, 0.5);
            --header-bg: rgba(0, 21, 41, 0.98);
        }

        [data-theme="green"] {
            --primary: #28a745;
            --primary-dark: #1e7e34;
            --secondary: #004d00;
            --accent: #00ff88;
            --background: #001a00;
            --card-bg: rgba(0, 77, 0, 0.95);
            --text: #ffffff;
            --text-muted: #99ff99;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff4444;
            --glass: rgba(40, 167, 69, 0.15);
            --neon-glow: 0 0 10px rgba(40, 167, 69, 0.7), 0 0 20px rgba(40, 167, 69, 0.5);
            --header-bg: rgba(0, 26, 0, 0.98);
        }

        [data-theme="purple"] {
            --primary: #6f42c1;
            --primary-dark: #5a2d91;
            --secondary: #2d1b69;
            --accent: #b19cd9;
            --background: #1a103d;
            --card-bg: rgba(45, 27, 105, 0.95);
            --text: #ffffff;
            --text-muted: #b19cd9;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff4444;
            --glass: rgba(111, 66, 193, 0.15);
            --neon-glow: 0 0 10px rgba(111, 66, 193, 0.7), 0 0 20px rgba(111, 66, 193, 0.5);
            --header-bg: rgba(26, 16, 61, 0.98);
        }

        body {
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
            padding: 15px;
            transition: all 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            opacity: 0.4;
            filter: brightness(0.7);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(0, 0, 0, 0.8) 0%, 
                rgba(0, 0, 0, 0.6) 50%, 
                rgba(0, 0, 0, 0.8) 100%);
            z-index: -1;
        }

        [data-theme="light"] .overlay {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.7) 0%, 
                rgba(255, 255, 255, 0.5) 50%, 
                rgba(255, 255, 255, 0.7) 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            min-height: calc(100vh - 30px);
            display: flex;
            flex-direction: column;
        }

        .theme-selector {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 10px;
            border-radius: 20px;
            border: 2px solid var(--glass);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .theme-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--neon-glow);
        }

        .theme-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px currentColor;
        }

        .theme-btn[data-theme="dark"] { background: linear-gradient(135deg, #0a0a0a, #2d2d2d); }
        .theme-btn[data-theme="light"] { background: linear-gradient(135deg, #ffffff, #e0e0e0); }
        .theme-btn[data-theme="red"] { background: linear-gradient(135deg, #dc3545, #ff6b6b); }
        .theme-btn[data-theme="blue"] { background: linear-gradient(135deg, #007bff, #7fdbff); }
        .theme-btn[data-theme="green"] { background: linear-gradient(135deg, #28a745, #00ff88); }
        .theme-btn[data-theme="purple"] { background: linear-gradient(135deg, #6f42c1, #b19cd9); }

        .header {
            text-align: center;
            padding: 40px 25px;
            background: var(--header-bg);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            margin-bottom: 25px;
            border: 2px solid var(--glass);
            box-shadow: var(--neon-glow);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, var(--primary), var(--accent), var(--primary));
            border-radius: 25px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite alternate;
        }

        @keyframes borderGlow {
            0% { opacity: 0.6; filter: hue-rotate(0deg); }
            100% { opacity: 1; filter: hue-rotate(360deg); }
        }

        .brand {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--accent), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 0 40px rgba(255, 68, 68, 0.8);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 400;
            letter-spacing: 1px;
            font-family: 'Exo 2', sans-serif;
            line-height: 1.4;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 25px;
            background: var(--glass);
            border-radius: 50px;
            text-decoration: none;
            color: var(--text);
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
        }

        .social-btn.telegram { background: linear-gradient(135deg, #0088cc, #00aced); }
        .social-btn.youtube { background: linear-gradient(135deg, #ff0000, #cc0000); }
        .social-btn.whatsapp { background: linear-gradient(135deg, #25D366, #128C7E); }

        .social-icon {
            font-size: 1.5rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-top: 20px;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--glass), transparent);
            transition: left 0.6s ease;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--neon-glow);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--glass);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.5rem;
            box-shadow: var(--neon-glow);
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 1.1rem;
            font-family: 'Exo 2', sans-serif;
        }

        .form-textarea {
            width: 100%;
            padding: 16px 18px;
            background: var(--glass);
            border: 2px solid var(--glass);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.3);
            transform: scale(1.02);
        }

        .char-counter, .line-counter {
            text-align: right;
            font-size: 0.9rem;
            margin-top: 8px;
            font-weight: 600;
        }

        .char-counter.warning, .line-counter.warning {
            color: var(--warning);
        }

        .char-counter.error, .line-counter.error {
            color: var(--error);
        }

        .formatting-tools {
            background: var(--glass);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid var(--glass);
        }

        .tools-section {
            margin-bottom: 20px;
        }

        .tools-title {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Exo 2', sans-serif;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(30px, 1fr));
            gap: 6px;
        }

        .tool-btn {
            padding: 12px 15px;
            background: var(--card-bg);
            border: 2px solid var(--glass);
            border-radius: 10px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .tool-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--neon-glow);
        }

        .color-btn {
            height: 30px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .color-btn:hover {
            transform: scale(1.1);
            border-color: var(--text);
            box-shadow: 0 0 8px currentColor;
        }

        .preview-section {
            background: var(--glass);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            border: 2px solid var(--glass);
            transition: all 0.3s ease;
        }

        .preview-section:hover {
            border-color: var(--primary);
            box-shadow: var(--neon-glow);
        }

        .preview-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: var(--text-muted);
            font-weight: 700;
            font-family: 'Exo 2', sans-serif;
        }

        .preview-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            min-height: 150px;
            border: 2px solid var(--glass);
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Arial', sans-serif;
            line-height: 1.8;
            text-align: left;
        }

        [data-theme="light"] .preview-box {
            background: rgba(0, 0, 0, 0.1);
        }

        .preview-line {
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .preview-line {
            background: rgba(0, 0, 0, 0.05);
        }

        .preview-line:hover {
            transform: translateX(5px);
        }

        .preview-segment {
            display: inline;
        }

        .credit {
            text-align: center;
            margin-top: 30px;
            padding: 20px;
            color: var(--text-muted);
            border-top: 2px solid var(--glass);
            font-size: 1rem;
            font-family: 'Exo 2', sans-serif;
            font-weight: 600;
        }

        .credit a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 800;
            transition: all 0.3s ease;
            position: relative;
        }

        .credit a:hover {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .credit a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .credit a:hover::after {
            width: 100%;
        }

        .info-box {
            background: rgba(255, 193, 7, 0.15);
            border: 2px solid rgba(255, 193, 7, 0.4);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            color: var(--warning);
            font-family: 'Exo 2', sans-serif;
        }

        .info-box ul {
            margin: 12px 0;
            padding-left: 20px;
        }

        .info-box li {
            margin-bottom: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .info-box strong {
            color: var(--warning);
            font-size: 1.1rem;
        }

        .feature-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 800;
            box-shadow: var(--neon-glow);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            z-index: 5;
        }

        @media (max-width: 768px) {
            .brand {
                font-size: 2.2rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .social-buttons {
                gap: 10px;
            }
            
            .social-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .card {
                padding: 20px;
            }
            
            .card-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>

        <div class="theme-btn" data-theme="blue" title="Blue Theme"></div>
        <div class="theme-btn" data-theme="green" title="Green Theme"></div>
        <div class="theme-btn" data-theme="purple" title="Purple Theme"></div>
    </div>
